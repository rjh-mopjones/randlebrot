[workspace]
resolver = "2"
members = [
    "crates/rb_core",
    "crates/rb_noise",
    "crates/rb_world",
    "crates/rb_tilemap",
    "crates/rb_entity_spawn",
    "crates/rb_editor",
    "crates/rb_player",
    "crates/rb_persistence",
    "crates/rb_artifacts",
    "crates/rb_voxel",
]

[workspace.dependencies]
bevy = { version = "0.18", default-features = true }
bevy_egui = "0.39"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
serde = { version = "1", features = ["derive"] }
bincode = "1"
ron = "0.8"
bitflags = "2"
clap = { version = "4", features = ["derive"] }

# Internal crate dependencies
rb_core = { path = "crates/rb_core" }
rb_noise = { path = "crates/rb_noise" }
rb_world = { path = "crates/rb_world" }
rb_tilemap = { path = "crates/rb_tilemap" }
rb_entity_spawn = { path = "crates/rb_entity_spawn" }
rb_editor = { path = "crates/rb_editor" }
rb_player = { path = "crates/rb_player" }
rb_persistence = { path = "crates/rb_persistence" }
rb_artifacts = { path = "crates/rb_artifacts" }
rb_voxel = { path = "crates/rb_voxel" }

[package]
name = "randlebrot"
version = "0.1.0"
edition = "2021"

[features]
default = ["gpu"]
gpu = ["rb_noise/gpu"]

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
clap.workspace = true
image.workspace = true
rayon = "1.10"
indicatif = "0.17"
chrono = "0.4"
bincode.workspace = true
ron.workspace = true
rb_core.workspace = true
rb_noise.workspace = true
rb_world.workspace = true
rb_tilemap.workspace = true
rb_entity_spawn.workspace = true
rb_editor.workspace = true
rb_player.workspace = true
rb_persistence.workspace = true
rb_artifacts.workspace = true
rb_voxel.workspace = true
objc2 = "0.6.4"

[workspace.lints.clippy]
# TODO: fix these and remove the allows
too_many_arguments = "allow"
type_complexity = "allow"
manual_range_contains = "allow"
manual_div_ceil = "allow"
needless_range_loop = "allow"
unnecessary_cast = "allow"
unnecessary_min_or_max = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
unwrap_or_default = "allow"
cloned_ref_to_slice_refs = "allow"
identity_op = "allow"
useless_format = "allow"
derivable_impls = "allow"
manual_flatten = "allow"
manual_filter = "allow"
unnecessary_map_or = "allow"
manual_clamp = "allow"

[workspace.lints.rust]
# TODO: fix these and remove the allows
unused_variables = "allow"
unused_imports = "allow"
unused_mut = "allow"
dead_code = "allow"
deprecated = "allow"
unused_assignments = "allow"

[[example]]
name = "save_all_debug_layers"
path = "examples/save_all_debug_layers.rs"

[lints]
workspace = true
