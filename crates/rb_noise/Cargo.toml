[package]
name = "rb_noise"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:rand", "dep:rand_xorshift"]

[dependencies]
rb_core.workspace = true
noise.workspace = true
image.workspace = true
bevy.workspace = true
serde.workspace = true
rayon = "1.10"
smallvec = { version = "1.13", features = ["serde"] }

# GPU compute (optional)
wgpu = { version = "27", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
rand_xorshift = { version = "0.3", optional = true }

[dev-dependencies]
bevy.workspace = true
bincode.workspace = true

[[example]]
name = "noise_preview"
path = "examples/noise_preview.rs"

[[example]]
name = "save_debug_layers"
path = "examples/save_debug_layers.rs"

[lints]
workspace = true
